# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - wa-motorsportsCal-dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

defaults:
  run:
    working-directory: src

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      
      - name: npm install and build
        run: |
          npm install
          npm run build

      - name: Move build files for deployment
        run: |
          mv ./build/static ./build/standalone/build
          if [ -d "public" ]; then mv ./public ./build/standalone; fi

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CC0CF0E895574412BEAA4985AED068E2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D3A0AC9F0BEB4A8A8B8C00823248D8EE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_57C0AF7CC1444BFAAEDC96D8A03D5310 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wa-motorsportscal-dev'
          slot-name: 'Production'
          package: ./src/build/standalone
          startup-command: 'node server.js'
